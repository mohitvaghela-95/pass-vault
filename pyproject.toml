[project]
name = "pass-vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohit", email = "mohit_vaghela@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
pass-vault = "pass_vault:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["F401"]  # F401 = unused imports
